<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pi publisher check</title>
<style>
  :root { color-scheme: light dark; --bg:#f5f5f5; --card:#fff; --ink:#222; --line:#e5e5e5; --code:#f3f3f3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --card:#1b1b1b; --ink:#ddd; --line:#333; --code:#222; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; }
  main { max-width:900px; margin:32px auto; padding:24px 28px; background:var(--card); border-radius:6px; }
  img, embed, iframe, video { max-width:100%; }
  figure { margin:0 0 24px; } figcaption { font-size:12px; opacity:.7; }
  table { border-collapse:collapse; width:100%; font-size:13px; display:block; overflow-x:auto; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  pre { white-space:pre-wrap; background:var(--code); padding:12px; border-radius:4px; overflow-x:auto; }
  a { color:#1a6fb5; }
  @media (max-width:600px) { main { margin:0; border-radius:0; padding:16px; } }
</style>
</head>
<body>
<main>
<h1>Pi publisher check</h1>
<p>Published from <strong>raspberrypi</strong> with <code>pub publish</code> on Oct 04 2026 04:03.</p>
<table>
<thead>
<tr>
<th>Step</th>
<th>Where</th>
</tr>
</thead>
<tbody>
<tr>
<td>File written</td>
<td>Pi</td>
</tr>
<tr>
<td>Rendered + noindex</td>
<td>pub</td>
</tr>
<tr>
<td>Pushed</td>
<td>GitHub Pages</td>
</tr>
</tbody>
</table>
</main>
</body>
</html>
